<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chatbot Widget Test</title>
  <style>
    /* body { font-family: sans-serif; padding: 20px; }
    #chatbot-container { width: 400px; margin: auto; } */
  </style>
  <link rel="stylesheet" href="https://github.com/sadguruy/private/blob/chatBot/chatbotWidget/dist/chatbot-widget.css" />
</head>
<body>
  <div id="chatbot-container"></div>
  <script src="https://github.com/sadguruy/private/blob/chatBot/chatbotWidget/dist/chatbot-widget.iife.js"></script>
  <script>
    window.renderChatbot('chatbot-container', {
      title: 'Welcome Sadguru', // title on top: default: 'Gemini Chat'
      theme: 'dark', // default: dark
      botIcons: false, // deactivate bot icons(default: true)
      position: 'bottom-right', //placing the bottom right (default: bottom-right)
      welcomeMessage: 'Hello! How can I assist you today?', // default: 'Hi! How can I help you today?'
      styles: {
        position: 'fixed',
        bottom: '10px',
        borderRadius: '5px',
        right: '10px',
      }
    });
  </script>
</body>
</html>
